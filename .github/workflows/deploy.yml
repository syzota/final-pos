name: Deploy to Hosting

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Setup Node.js & Build Frontend React + Vite
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install & Build Frontend
        run: |
          npm install
          npm run build

      # 2. Upload hasil build ke public_html/build/ di Hosting via SCP
      - name: Upload Build Assets to Hosting
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTING_IP }}
          username: ${{ secrets.HOSTING_USER }}
          key: ${{ secrets.HOSTING_SSH_KEY }}
          port: ${{ secrets.HOSTING_PORT }}
          source: "public/build/*"
          target: "/home/posyand9/public_html/build"
          strip_components: 2

      # 3. Pull Kode Backend & Jalankan Artisan di Hosting via SSH
      - name: Deploy Backend & Run Migrations via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTING_IP }}
          username: ${{ secrets.HOSTING_USER }}
          key: ${{ secrets.HOSTING_SSH_KEY }}
          port: ${{ secrets.HOSTING_PORT }}
          script: |
            cd /home/posyand9/posyandu
            git pull origin main
            composer install --no-dev --optimize-autoloader
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
