services:
  # 1. Aplikasi Laravel (PHP 8.3 FPM)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posyandu_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    networks:
      - posyandu_net
    depends_on:
      db:
        condition: service_healthy

  # 2. Web Server Nginx
  nginx:
    image: nginx:alpine
    container_name: posyandu_nginx
    restart: unless-stopped
    ports:
      - "${FORWARD_HTTP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - posyandu_net
    depends_on:
      - app

  # 3. Basis Data MySQL 8.0
  db:
    image: mysql:8.0
    container_name: posyandu_db
    restart: unless-stopped
    ports:
      - "${FORWARD_DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: "${DB_DATABASE:-posyandu_db}"
      MYSQL_USER: "${DB_USERNAME:-posyandu_user}"
      MYSQL_PASSWORD: "${DB_PASSWORD:-posyandu_pass}"
      MYSQL_ROOT_PASSWORD: "${DB_ROOT_PASSWORD:-root_password}"
    volumes:
      - posyandu_db_data:/var/lib/mysql
      - ../database/posyandu_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USERNAME:-posyandu_user}", "-p${DB_PASSWORD:-posyandu_pass}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - posyandu_net

  # 4. Database Management GUI (phpMyAdmin)
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: posyandu_pma
    restart: unless-stopped
    ports:
      - "${FORWARD_PMA_PORT:-8081}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: "${DB_USERNAME:-posyandu_user}"
      PMA_PASSWORD: "${DB_PASSWORD:-posyandu_pass}"
      UPLOAD_LIMIT: 64M
    depends_on:
      - db
    networks:
      - posyandu_net

volumes:
  posyandu_db_data:
    driver: local

networks:
  posyandu_net:
    driver: bridge
