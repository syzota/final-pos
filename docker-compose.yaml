services:
    laravel:
        build: .
        env_file:
            - .env.docker
        ports:
            - "8000:8000"
        volumes:
            - .:/app
            - vendor_data:/app/vendor
        depends_on:
            - mysql
        command: php artisan serve --host=0.0.0.0 --port=8000

    mysql:
        image: mysql:8.4
        restart: always
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: posyandu_db
        ports:
            - "3307:3306"
        volumes:
            - mysql_data:/var/lib/mysql

volumes:
    mysql_data:
    vendor_data:
